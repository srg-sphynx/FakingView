name: Release FakingView

# Releases are an explicit maintainer action. A tag created by the initial manual
# publication does not start another competing build or overwrite its assets.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Prepared Cargo version, for example 0.1.0"
        required: true
        type: string

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: "1.100.0"
  CARGO_TERM_COLOR: always

concurrency:
  group: fakingview-release-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the prepared main commit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.metadata.outputs.sha }}
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Bind the release to a version and commit
        id: metadata
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_REF: ${{ github.ref }}
        run: |
          python3 - <<'PY'
          import os, pathlib, re, subprocess, tomllib
          version = os.environ["RELEASE_VERSION"]
          if not re.fullmatch(r"(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.[1-9][0-9]*)?", version):
              raise SystemExit("Use a valid X.Y.Z or X.Y.Z-(alpha|beta|rc).N version")
          if os.environ["RELEASE_REF"] != "refs/heads/main":
              raise SystemExit("Dispatch a release from main")
          manifest = tomllib.loads(pathlib.Path("Cargo.toml").read_text())
          if manifest["package"]["name"] != "fakingview" or manifest["package"]["version"] != version:
              raise SystemExit("Run tools/release.sh prepare VERSION and commit the version first")
          lock = tomllib.loads(pathlib.Path("Cargo.lock").read_text())
          root = [p for p in lock["package"] if p["name"] == "fakingview" and "source" not in p]
          if len(root) != 1 or root[0]["version"] != version:
              raise SystemExit("Cargo.lock root version does not match the prepared release")
          sha = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          subprocess.run(["git", "merge-base", "--is-ancestor", sha, "origin/main"], check=True)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"sha={sha}\nversion={version}\ntag=v{version}\n")
          PY

  build:
    name: Test and build macOS arm64
    needs: verify
    # GitHub documents macos-15 as an Apple Silicon runner. Fail if that changes.
    runs-on: macos-15
    timeout-minutes: 60
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
      CLANG_MODULE_CACHE_PATH: ${{ github.workspace }}/target/swift-module-cache
      FAKINGVIEW_NO_KEYCHAIN: "1"
      RELEASE_SHA: ${{ needs.verify.outputs.sha }}
      RELEASE_TAG: ${{ needs.verify.outputs.tag }}
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      # Release artifacts never restore a compiler/build cache and need no Apple secrets.
      - name: Validate the checkout
        run: |
          test "$(uname -m)" = arm64
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          cargo fmt --all -- --check
          cargo test --locked
          cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Build the Finder application
        env:
          FAKINGVIEW_BUILD_ID: ${{ needs.verify.outputs.sha }}
        run: ./tools/bundle.sh
      - name: Package app, license notices and corresponding source
        run: |
          licenses=target/FakingView.app/Contents/Resources/Licenses
          test -f "$licenses/OFL-JetBrainsMono.txt"
          test -f "$licenses/OFL-NotoSansSymbols2.txt"
          cp LICENSE.md "$licenses/GPL-3.0.txt"
          cp THIRD_PARTY_NOTICES.md "$licenses/THIRD_PARTY_NOTICES.md"
          cp docs/getting-started.md target/FakingView.app/Contents/Resources/Getting-Started.md
          cp docs/app-specs.md target/FakingView.app/Contents/Resources/App-Specs.md
          /usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' target/FakingView.app/Contents/Info.plist | grep -Fx local.fakingview.desktop
          file target/FakingView.app/Contents/MacOS/FakingView | grep -F arm64
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent target/FakingView.app "dist/FakingView-${RELEASE_TAG}-macos-arm64.zip"
          ./tools/make-dmg.sh target/FakingView.app "dist/FakingView-${RELEASE_TAG}-macos-arm64.dmg"
          git archive --format=tar --prefix="FakingView-${RELEASE_VERSION}/" "$RELEASE_SHA" | gzip -n > "dist/FakingView-${RELEASE_TAG}-source.tar.gz"
          (
            cd dist
            shasum -a 256 "FakingView-${RELEASE_TAG}-macos-arm64.dmg" "FakingView-${RELEASE_TAG}-macos-arm64.zip" "FakingView-${RELEASE_TAG}-source.tar.gz" > SHA256SUMS.txt
            shasum -a 256 -c SHA256SUMS.txt
          )
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: fakingview-release
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish the reviewed artifacts
    needs: [verify, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      RELEASE_SHA: ${{ needs.verify.outputs.sha }}
      RELEASE_TAG: ${{ needs.verify.outputs.tag }}
      RELEASE_VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ needs.verify.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: fakingview-release
          path: dist
      - name: Verify and publish once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (
            cd dist
            shasum -a 256 -c SHA256SUMS.txt
          )
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::This release already exists. Published releases are never overwritten."
            exit 1
          fi
          if existing=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" --jq .sha 2>/dev/null); then
            test "$existing" = "$RELEASE_SHA"
          fi
          python3 - <<'PY'
          import os, pathlib
          tag = os.environ["RELEASE_TAG"]
          version = os.environ["RELEASE_VERSION"]
          sha = os.environ["RELEASE_SHA"]
          repo = os.environ["GITHUB_REPOSITORY"]
          tracked = pathlib.Path("docs/releases") / f"{tag}.md"
          if tracked.is_file():
              text = tracked.read_text()
          else:
              text = f"""FakingView {version} for Apple Silicon Macs running macOS 14 or newer.

          Download the macOS arm64 DMG, open it and drag FakingView into Applications.

          This is an unsigned, non-notarized build for manual installation. Background alerts use the foreground fallback. The package contains the app and alert helper; the matching source archive is attached under GPL-3.0-only.

          Kite Connect requires your own eligible daily session. Authentication and live-data entitlements must be verified with your account. Watchlist quotes stream over WebSocket; chart candles refresh from the historical API. Kite order entry and INR paper/portfolio accounting are not included.

          Installation and setup: https://github.com/{repo}/blob/{sha}/docs/getting-started.md

          App specifications: https://github.com/{repo}/blob/{sha}/docs/app-specs.md

          Source commit: {sha}

          Verify downloaded assets against SHA256SUMS.txt.
          """
          pathlib.Path("release-notes.md").write_text(text)
          PY
          if [ "$RELEASE_VERSION" != "${RELEASE_VERSION%%-*}" ]; then
            flags=(--prerelease)
          else
            flags=(--latest)
          fi
          gh release create "$RELEASE_TAG" \
            "dist/FakingView-${RELEASE_TAG}-macos-arm64.dmg" \
            "dist/FakingView-${RELEASE_TAG}-macos-arm64.zip" \
            "dist/FakingView-${RELEASE_TAG}-source.tar.gz" dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" --target "$RELEASE_SHA" \
            --title "FakingView ${RELEASE_VERSION}" --notes-file release-notes.md "${flags[@]}"
