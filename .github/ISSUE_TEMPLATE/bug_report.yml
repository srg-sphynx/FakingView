name: Bug report
description: Report a reproducible FakingView problem.
body:
  - type: markdown
    attributes:
      value: Do not include API keys, access tokens, API secrets or personal portfolio data. Security vulnerabilities should be reported privately as described in SECURITY.md.
  - type: input
    id: version
    attributes:
      label: FakingView version
      description: Copy the version from Settings → About.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: macOS version and Mac architecture
      placeholder: macOS 14.7, Apple Silicon
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the source, symbol and timeframe if relevant; omit credentials.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or redacted diagnostics
